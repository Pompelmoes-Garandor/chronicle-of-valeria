<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Riven Mirror Quiz</title>

<meta property="og:title" content="Riven Mirror Quiz">
<meta property="og:description" content="17 Riven mirror questions for Stuttgart. How sharp is your Broken Blade?">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Nunito+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<style>
/* Layout: phone-first arcade run. One question card at a time: real cards on a mini battlefield, answers below. */
:root{
  --bg:#110f1b; --panel:#1c192b; --raise:#262138; --line:#352f4d; --fg:#f2effb; --mute:#a69fc2;
  --calm:#3fd19c; --chaos:#c55df2; --gold:#f4c24c; --bad:#ff6b6b; --felt:#0b0a13;
  --display:"Chakra Petch","Arial Narrow",sans-serif; --body:"Nunito Sans",system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;min-height:100vh;background:radial-gradient(120% 60% at 50% -10%,#2b1f48 0%,var(--bg) 62%) fixed,var(--bg);color:var(--fg);font:16px/1.45 var(--body);
  padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));padding-block:16px 40px}
.wrap{max-width:600px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.brand{font:700 20px/1 var(--display);letter-spacing:.05em;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.brand img{width:26px;height:26px}
.brand span{background:linear-gradient(90deg,var(--calm),var(--chaos));-webkit-background-clip:text;background-clip:text;color:transparent}
.hud{display:flex;gap:6px}
.chip{font:700 13px var(--display);padding:6px 10px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-variant-numeric:tabular-nums}
.chip.streak{color:var(--gold)}
.bar{height:6px;background:var(--panel);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--calm),var(--chaos));transition:width .4s}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:14px}
.tag{font:700 11px var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--chaos)}
h1,h2{margin:0;font:700 21px/1.25 var(--display);text-wrap:balance}
h1{font-size:30px;text-align:center}
.board{display:flex;flex-direction:column;gap:10px;background:radial-gradient(90% 120% at 50% 50%,#1a1630 0%,var(--felt) 100%);border:1px solid var(--line);border-radius:14px;padding:12px 10px}
.row{display:flex;gap:10px;align-items:flex-end;justify-content:center;flex-wrap:wrap}
.lbl{font:700 10px var(--display);letter-spacing:.16em;color:var(--mute);text-align:center}
.lbl.them{color:var(--chaos)} .lbl.you{color:var(--calm)}
.mid{height:1px;background:linear-gradient(90deg,transparent,var(--line),transparent)}
.tc{all:unset;position:relative;width:clamp(78px,23vw,108px);display:flex;flex-direction:column;align-items:center;gap:4px;cursor:zoom-in}
.tc:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:8px}
.tc img{width:100%;border-radius:6px;display:block;box-shadow:0 6px 16px rgba(0,0,0,.55)}
.tc.you img{box-shadow:0 0 0 2px var(--calm),0 6px 16px rgba(0,0,0,.55)}
.tc.them img{box-shadow:0 0 0 2px var(--chaos),0 6px 16px rgba(0,0,0,.55)}
.tc.wide{width:clamp(120px,34vw,150px)}
.tc.ex img{transform:rotate(8deg);filter:brightness(.7)}
.might{position:absolute;top:-9px;right:-9px;min-width:30px;height:30px;padding:0 6px;border-radius:15px;background:var(--gold);color:#1b1300;font:700 15px/30px var(--display);text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.5)}
.might.q{background:var(--chaos);color:#fff;animation:pulse 1.2s infinite}
.cap{font-size:11px;font-weight:800;color:var(--mute);text-align:center;line-height:1.15}
.runes{display:flex;gap:4px;align-items:center;flex-direction:column}
.runes div{display:flex;gap:2px}
.runes img{width:26px;height:26px}
.tok{font:700 26px var(--display);color:var(--gold);padding:10px 14px;border:1px dashed var(--line);border-radius:10px}
.opts{display:grid;gap:10px}
.opts.cards{grid-template-columns:repeat(auto-fit,minmax(90px,1fr))}
.opt{all:unset;cursor:pointer;padding:14px;border-radius:12px;background:var(--raise);border:1.5px solid var(--line);font-weight:700;transition:transform .12s,border-color .12s}
.opt:hover{border-color:var(--mute)} .opt:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.opt:active{transform:scale(.97)}
.opts.cards .opt{padding:8px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font-size:13px}
.opts.cards .opt img{width:100%;max-width:120px;border-radius:6px}
.opt.ok{border-color:var(--calm);background:color-mix(in srgb,var(--calm) 20%,var(--raise))}
.opt.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 16%,var(--raise))}
.opt[disabled]{cursor:default}
.why{border-left:3px solid var(--calm);padding:10px 12px;background:#15121f;border-radius:0 10px 10px 0;font-size:15px}
.why.badw{border-color:var(--bad)}
.why strong{font-family:var(--display)}
.btn{all:unset;display:block;cursor:pointer;text-align:center;padding:14px;border-radius:12px;font:700 16px var(--display);letter-spacing:.06em;text-transform:uppercase;color:#120d1d;background:linear-gradient(90deg,var(--calm),var(--chaos))}
.btn.alt{background:#25d366;color:#06240f}
.btn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.fan{position:relative;height:250px;margin:6px auto 34px;width:100%;max-width:360px}
.fan img{position:absolute;left:50%;bottom:0;width:120px;border-radius:8px;box-shadow:0 10px 24px rgba(0,0,0,.6);transform-origin:50% 130%;transition:transform .5s}
.big{font:700 64px/1 var(--display);text-align:center;background:linear-gradient(90deg,var(--calm),var(--chaos));-webkit-background-clip:text;background-clip:text;color:transparent}
.rank{text-align:center;font:700 22px var(--display);color:var(--gold)}
.center{text-align:center;color:var(--mute)}
.miss{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.miss li{display:flex;gap:10px;align-items:center;background:var(--raise);border-radius:10px;padding:8px;font-size:14px}
.miss img{width:40px;border-radius:4px}
.hint{font-size:12px;color:var(--mute);text-align:center}
#zoom{position:fixed;inset:0;z-index:20;background:rgba(5,4,10,.88);display:flex;align-items:center;justify-content:center;padding:24px;cursor:zoom-out}
#zoom img{max-width:min(92vw,420px);max-height:86vh;border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.7)}
canvas{position:fixed;inset:0;pointer-events:none;z-index:15}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes pulse{50%{transform:scale(1.12)}}
@keyframes deal{from{transform:translateY(16px) scale(.9);opacity:.2}to{transform:none;opacity:1}}
.board .tc{animation:deal .35s both}
@media (prefers-reduced-motion:reduce){.shake,.board .tc,.might.q{animation:none}.bar i,.fan img{transition:none}}
</style></head><body>

  <div class="bar"><i id="prog"></i></div>
  <main id="stage" class="card" aria-live="polite"></main>

const ranks=[[0,"Poro in training"],[7,"Gank apprentice"],[11,"Blade dancer"],[14,"Broken Blade"],[17,"Exile of Stuttgart 👑"]];
let i=0,score=0,streak=0,best=0,right=0,missed=[];
const $=id=>document.getElementById(id),st=$("stage");
$("logo").src=IMG.Chaos;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function tc(e,side,k){const[code,m,cap,fl]=e;
 if(code.startsWith("RUNES:"))return `<div class="runes"><div><img src="${IMG.Chaos}" alt="Chaos rune"><img src="${IMG.Chaos}" alt="Chaos rune"></div><div class="cap">2 energy + 2 Chaos<br>open</div></div>`;
 if(code.startsWith("TOK:"))return `<div class="runes"><div class="tok">${esc(code.slice(4))}</div><div class="cap">${esc(cap||"points")}</div></div>`;
 return `<button class="tc ${side} ${fl||""}" style="animation-delay:${k*70}ms" data-z="${code}" aria-label="${esc(N[code]||code)}"><img src="${IMG[code]}" alt="${esc(N[code]||code)}">${m!==""?`<span class="might ${m==="?"?"q":""}">${esc(m)}</span>`:""}${cap?`<span class="cap">${esc(cap)}</span>`:""}</button>`}
function board(b){if(!b.you&&!b.them)return"";let h='<div class="board">';
 if(b.them)h+=`<div class="lbl them">THEM</div><div class="row">${b.them.map((e,k)=>tc(e,"them",k)).join("")}</div>`;
 if(b.them&&b.you)h+='<div class="mid"></div>';
 if(b.you)h+=`<div class="row">${b.you.map((e,k)=>tc(e,"you",k+(b.them?b.them.length:0))).join("")}</div><div class="lbl you">YOU</div>`;return h+"</div>"}
function hud(){$("score").textContent=score+" pts";$("streak").textContent="🔥 "+streak;$("prog").style.width=(i/Q.length*100)+"%"}
function intro(){const fan=["VEN-044","RAD-150","UNL-147","OGN-077","RAD-043"],rot=[-26,-13,13,26,0];
 st.innerHTML=`<div class="fan">${fan.map((c,k)=>`<img src="${IMG[c]}" alt="${esc(N[c])}" style="transform:translateX(-50%) rotate(${rot[k]}deg);bottom:${k===4?18:0}px">`).join("")}</div>
 <h1>How sharp is your Broken Blade?</h1><p class="center">17 Riven mirror situations with real cards. Streaks score extra. Built for Stuttgart.</p>
 <button class="btn" id="go">Deal me in</button>`;$("go").onclick=show;hud()}
function show(){hud();const q=Q[i],cardOpts=typeof q.o[0]==="object";
 st.innerHTML=`<div class="tag">${i+1} / ${Q.length} · ${esc(q.tag)}</div><h2>${esc(q.q)}</h2>${board(q.b)}
 <div class="opts ${cardOpts?"cards":""}">${q.o.map((t,k)=>cardOpts?`<button class="opt" data-k="${k}"><img src="${IMG[t.c]}" alt="">${esc(t.t)}</button>`:`<button class="opt" data-k="${k}">${esc(t)}</button>`).join("")}</div><div id="after"></div>`;
 st.querySelectorAll(".opt").forEach(b=>b.onclick=()=>pick(+b.dataset.k));window.scrollTo({top:0,behavior:"smooth"})}
function pick(k){const q=Q[i],ok=k===q.a;
 st.querySelectorAll(".opt").forEach((b,n)=>{b.disabled=true;if(n===q.a)b.classList.add("ok");else if(n===k)b.classList.add("no")});
 if(ok){right++;streak++;best=Math.max(best,streak);score+=100+Math.min(streak-1,5)*20;burst(streak>=3?90:40)}
 else{streak=0;missed.push(i);st.classList.remove("shake");void st.offsetWidth;st.classList.add("shake")}
 const m=st.querySelector(".might.q");if(m){m.textContent="8";m.classList.remove("q")}
 const cheers=["Clean.","Nice read!","Riven approves.","Ganked it.","Exactly right."],boos=["Not quite.","Close!","The Exile frowns.","Good one to drill."];
 $("after").innerHTML=`<div class="why ${ok?"":"badw"}"><strong>${ok?cheers[i%5]:boos[i%4]}</strong> ${esc(q.w)}</div>
 <button class="btn" id="nx">${i<Q.length-1?"Next":"See my rank"}</button>`;
 hud();$("nx").scrollIntoView({behavior:"smooth",block:"nearest"});$("nx").onclick=()=>{i++;i<Q.length?show():end()}}
function firstCard(q){const all=[...(q.b.you||[]),...(q.b.them||[])].map(e=>e[0]).filter(c=>IMG[c]&&c!=="BACK");return all[0]||"RAD-149"}
function end(){i=Q.length;hud();const r=ranks.filter(x=>right>=x[0]).pop()[1];
 const msg=`I scored ${right}/${Q.length} (${r}) on the Riven Mirror Quiz ⚔️ Beat me: ${location.href.split("#")[0]}`;
 st.innerHTML=`<div class="tag">Final</div><div class="big">${right}/${Q.length}</div><div class="rank">${esc(r)}</div>
 <p class="center">${score} points · best streak 🔥 ${best}</p>
 ${missed.length?`<div class="tag">Drill these together</div><ul class="miss">${missed.map(n=>`<li><img src="${IMG[firstCard(Q[n])]}" alt="">${esc(Q[n].q)}</li>`).join("")}</ul>`:`<p class="center">Perfect run. Go take the play.</p>`}
 <a class="btn alt" href="https://wa.me/?text=${encodeURIComponent(msg)}" target="_blank" rel="noopener">Share score on WhatsApp</a>
 <button class="btn" id="again">Play again</button>`;
 if(right>=14)burst(240);$("again").onclick=()=>{i=0;score=0;streak=0;best=0;right=0;missed=[];show()}}
st.addEventListener("click",e=>{const b=e.target.closest(".tc");if(!b)return;const z=$("zoom");z.querySelector("img").src=IMG[b.dataset.z];z.querySelector("img").alt=N[b.dataset.z]||"";z.hidden=false});
$("zoom").onclick=()=>$("zoom").hidden=true;
addEventListener("keydown",e=>{if(e.key==="Escape")$("zoom").hidden=true});
/* confetti */
const cv=$("fx"),cx=cv.getContext("2d");let parts=[],raf=0;const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
function size(){cv.width=innerWidth*devicePixelRatio;cv.height=innerHeight*devicePixelRatio}addEventListener("resize",size);size();
function burst(n){if(reduce)return;const cols=["#3fd19c","#c55df2","#f4c24c","#f2effb"],d=devicePixelRatio;
 for(let k=0;k<n;k++)parts.push({x:cv.width/2,y:cv.height*.35,vx:(Math.random()-.5)*14*d,vy:(-Math.random()*12-4)*d,r:(3+Math.random()*4)*d,c:cols[k%4],l:70+Math.random()*40,a:Math.random()*6});
 if(!raf)tick()}
function tick(){cx.clearRect(0,0,cv.width,cv.height);parts=parts.filter(p=>p.l-->0);
 for(const p of parts){p.vy+=.45*devicePixelRatio;p.x+=p.vx;p.y+=p.vy;p.a+=.2;cx.fillStyle=p.c;cx.save();cx.translate(p.x,p.y);cx.rotate(p.a);cx.fillRect(-p.r,-p.r/2,p.r*2,p.r);cx.restore()}
 raf=parts.length?requestAnimationFrame(tick):0;if(!raf)cx.clearRect(0,0,cv.width,cv.height)}
intro();
</script>
