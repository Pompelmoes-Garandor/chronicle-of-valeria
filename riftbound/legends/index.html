<style>

:root{--bg:#f4f2f9;--surface:#fbfaff;--raised:#ffffff;--ink:#17142a;--muted:#625a7e;--line:#dcd7ea;--line-strong:#c4bdd9;--accent:#4433b8;--accent-ink:#ffffff;--soft:#ebe7f7;--good:#1f7a4d;--warn:#a5521b;

 --display:"Space Grotesk",system-ui,sans-serif;--text:"Inter",system-ui,sans-serif;--mono:"JetBrains Mono",ui-monospace,monospace}

:root[data-theme="dark"]{--bg:#0f0d18;--surface:#1a1726;--raised:#221e33;--ink:#efedf8;--muted:#a9a3c2;--line:#2f2a44;--line-strong:#463f63;--accent:#a39aff;--accent-ink:#120f1f;--soft:#27223d;--good:#5fd39a;--warn:#f0a26a;--glow:0 1px 0 #ffffff0d inset,0 10px 30px -14px #000000;--fury:#ef6a61;--calm:#55c487;--mind:#62a8ee;--body:#f0a24a;--chaos:#b687ea;--order:#e2c443;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--text)}
.wrap{max-width:640px;margin:0 auto;padding-block:20px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
h1{font:700 34px/1.05 var(--display);margin:0;letter-spacing:-.02em;text-wrap:balance}
h2{font:700 24px/1.15 var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h3{font:700 17px/1.25 var(--display);margin:0}
h2:focus,h1:focus{outline:none}
p{margin:0}
a{color:var(--accent)}
.eyebrow{display:flex;align-items:center;gap:8px;font:500 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.eyebrow::before{content:"";width:7px;height:7px;transform:rotate(45deg);border:1.5px solid currentColor;flex:none}
.eyebrow::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line-strong),transparent)}
.lab{display:flex;align-items:center;gap:6px;font:500 10.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.lab::before{content:"";width:5px;height:5px;transform:rotate(45deg);background:var(--d1,var(--accent));flex:none}
.lead{color:var(--muted);max-width:54ch}
.dots{display:inline-flex;gap:5px;flex:none}
.dot{width:12px;height:12px;border-radius:50%;display:inline-block;flex:none}
.Fury{background:var(--fury)}.Calm{background:var(--calm)}.Mind{background:var(--mind)}.Body{background:var(--body)}.Chaos{background:var(--chaos)}.Order{background:var(--order)}
button{font:600 15px var(--text);cursor:pointer;border-radius:12px;border:1px solid var(--line);background:var(--raised);color:var(--ink);padding:12px 14px;text-align:left;min-height:44px}
button:focus-visible,input:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);text-align:center;padding:14px 18px}
.ghost{background:transparent;text-align:center}
.link{border:0;background:none;padding:0 2px;color:var(--accent);font-weight:600;text-decoration:underline;text-underline-offset:3px;text-align:left;display:inline-flex;align-items:center;min-height:44px}
.progress{height:6px;border-radius:3px;background:var(--line);overflow:hidden}

.opts,.stack{display:flex;flex-direction:column;gap:10px}

.opt::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:0 3px 3px 0;background:var(--line-strong)}
@media (hover:hover){.opt:hover{border-color:var(--line-strong)}.opt:hover::before{background:var(--accent)}}
.opt[aria-pressed="true"]{border-color:var(--accent)}.opt[aria-pressed="true"]::before{background:var(--accent)}
.opt:active{transform:scale(.985)}
.opt small{display:block;font-weight:400;color:var(--muted);font-size:13px}
.opt>span:last-child{min-width:0}
.opt>.dot{width:16px;height:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row>*{min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--glow)}
.legend{--d1:var(--accent);--d2:var(--accent);padding:0 16px 16px;gap:14px;border:3px solid transparent;border-radius:20px;background:linear-gradient(var(--surface),var(--surface)) padding-box,linear-gradient(160deg,var(--d1),var(--d2)) border-box;overflow:hidden}
.band{margin:0 -16px;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;background:linear-gradient(100deg,color-mix(in srgb,var(--d1) 22%,var(--surface)),color-mix(in srgb,var(--d2) 22%,var(--surface)))}
.name{font:700 34px/1 var(--display);letter-spacing:-.02em}
.sub{color:var(--muted)}
.pill{background:var(--raised);border:1px solid var(--line-strong);border-radius:999px;padding:3px 10px;font:500 11.5px var(--mono);letter-spacing:.04em;white-space:nowrap}
.meter{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;width:var(--w);background:linear-gradient(90deg,var(--d1),var(--d2));animation:fill .7s ease-out}
@keyframes fill{from{width:0}}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.fact{position:relative;background:var(--raised);border:1px solid var(--line);border-radius:10px;padding:9px 10px 9px 42px;min-height:56px}
.fact::before{content:attr(data-gem);position:absolute;left:10px;top:50%;translate:0 -50%;width:24px;height:24px;display:grid;place-items:center;font:700 12px var(--display);color:var(--accent-ink);background:var(--accent);clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
.fact b{display:block;font:700 15px/1.25 var(--display)}
.fact span{font:500 10px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
ul,ol{margin:0;padding-left:20px}
li+li{margin-top:5px}
.mini{display:flex;justify-content:space-between;gap:10px;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--raised);border:1px solid var(--line-strong);border-radius:6px;padding:4px 10px 4px 8px;display:inline-flex;align-items:center;gap:6px;font-size:13.5px}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--d1,var(--accent))}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.box{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--raised)}
details{border:1px solid var(--line);border-radius:12px;padding:0 14px;background:var(--raised)}
summary{cursor:pointer;font-weight:600;padding-block:12px;min-height:44px;list-style-position:inside}
details[open]{padding-bottom:12px}
details>*+*{margin-top:10px}
table{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font:500 10.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
td.n{text-align:right}
.small{font-size:13px;color:var(--muted)}
.toast{font:500 12.5px var(--mono);color:var(--accent);min-height:1.4em}

.step{display:flex;gap:12px}
.num{font:700 14px var(--display);width:30px;height:30px;display:grid;place-items:center;flex:none;color:var(--accent-ink);background:var(--accent);clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
.step>div{min-width:0}
.check{display:flex;gap:10px;align-items:flex-start;min-height:44px}
.check input{width:22px;height:22px;margin-top:2px;flex:none;accent-color:var(--accent)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{padding:8px 14px;border-radius:999px;font-size:14px;text-align:center}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.term{border:0;background:none;padding:0;min-height:0;font:inherit;color:inherit;text-decoration:underline dotted var(--accent);text-decoration-thickness:2px;text-underline-offset:3px;cursor:help}
.journey{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
.jstep{display:flex;flex-direction:column;align-items:center;gap:4px;border:0;background:none;padding:6px 2px;min-height:52px;text-align:center;font:500 10.5px/1.2 var(--text);color:var(--muted)}
.jstep i{width:18px;height:18px;transform:rotate(45deg);border:2px solid var(--line-strong);border-radius:3px;background:var(--surface)}
.jstep.done{color:var(--ink)}.jstep.done i{background:var(--good);border-color:var(--good)}
.jstep.next{color:var(--accent)}.jstep.next i{border-color:var(--accent)}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;text-align:center}
.vs b{font:700 18px var(--display)}
.ok{color:var(--good);font-weight:600}.no{color:var(--warn);font-weight:600}

.sheet>div{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.sigil{display:block}
nav{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;justify-content:center;background:color-mix(in srgb,var(--surface) 90%,transparent);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-top:6px;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
nav button{flex:1;max-width:150px;border:0;border-radius:12px;margin:0 4px 6px;padding:8px 4px;min-height:52px;background:none;text-align:center;font:500 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}

@media (prefers-reduced-motion:reduce){.progress i,.opt{transition:none}.opt:active{transform:none}.meter i{animation:none}}
</style>

const GMAP={};GLOSS.forEach(g=>GMAP[g[0].toLowerCase()]=g);
const ALIAS={units:'unit',spells:'spell',tokens:'token',runes:'rune',exhausted:'exhaust',readies:'ready',conquers:'conquer',holds:'hold',banished:'banish',empowered:'empower',battlefields:'battlefield',equipment:'gear'};
const TERMRE=new RegExp('\\b('+Object.keys(GMAP).concat(Object.keys(ALIAS)).sort((a,b)=>b.length-a.length).map(w=>w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')\\b','gi');
function gl(text){const used={};return esc(text).replace(TERMRE,(m)=>{const k=ALIAS[m.toLowerCase()]||m.toLowerCase();if(used[k]||!GMAP[k])return m;used[k]=1;return `<button class="term" data-term="${esc(k)}">${m}</button>`})}
function showTerm(k){const g=GMAP[k];if(!g)return;document.getElementById('sheetT').textContent=g[0];document.getElementById('sheetB').textContent=g[1];document.getElementById('sheet').hidden=false}

/* ---------- journey ---------- */
const JSTEPS=[['found','Legend','find'],['learned','Rules','learn'],['checked','Quiz','learn'],['deck','Deck','buy'],['night','Game night','play']];
const BADGE={found:['Legend Found','You know who you play.'],learned:['Turn Ready','You know how a turn works.'],checked:['Rules Sharp','6 of 8 or better on the rules check.'],deck:['Deck in Hand','You have your first deck.'],night:['Table Ready','Packed and ready for game night.']};
function jdone(k){return k==='found'?!!(mine||ans.length>=Q.length):!!J[k]}
function journey(){const n=JSTEPS.findIndex(s=>!jdone(s[0]));const c=JSTEPS.filter(s=>jdone(s[0])).length;
  return `<section aria-label="Your progress"><div class="mini"><div class="lab">Your path to the table</div><span class="small">${c} of 5</span></div>
  <div class="journey">${JSTEPS.map((s,i)=>`<button class="jstep ${jdone(s[0])?'done':i===n?'next':''}" data-go="${s[2]}" title="${esc(BADGE[s[0]][0])}: ${esc(BADGE[s[0]][1])}"><i></i>${esc(s[1])}</button>`).join('')}</div></section>`}
function setJ(k){if(J[k])return;J[k]=true;store.set('journey',J);toast('Badge earned: '+BADGE[k][0])}
function toast(t){const e=document.getElementById('toast');if(e){e.textContent=t;setTimeout(()=>{if(e.textContent===t)e.textContent=''},4000)}}

/* ---------- legend card ---------- */
function facts(l){const r=readyInfo(l);return `<div class="facts">
  <div class="fact" data-gem="${GEM[l[9]]}"><span>Difficulty</span><b>${EASE[l[9]]}</b></div>
  <div class="fact" data-gem="★"><span>${gl('Tier')} (1 Nov)</span><b>${l[5]||'Not ranked'}</b></div>
  <div class="fact" data-gem="◆"><span>Set</span><b>${esc(l[2])}</b></div>
  <div class="fact" data-gem="✓"><span>Deck</span><b>${r?esc(r[0]):'Single cards'}</b></div></div>`}
function guide(l){const p=P[key(l)]||{};let h='';
  if(p.plan&&p.plan.length)h+=`<div><h3>How you play ${esc(l[0])}</h3><ol>${p.plan.map(x=>`<li>${gl(x)}</li>`).join('')}</ol></div>`;
  let more='';
  if(p.ability)more+=`<div><div class="lab">Legend ability</div><p>${gl(p.ability)}</p></div>`;
  if(p.champion)more+=`<div><div class="lab">${gl('Champion unit')}</div><p>${esc(p.champion)}</p></div>`;
  if(more)h+=`<details><summary>Ability and champion</summary>${more}</details>`;
  let m2='';
  if(p.keyCards&&p.keyCards.length)m2+=`<div><div class="lab">Cards the deck is known for</div><div class="chips">${p.keyCards.map(x=>`<span class="chip">${esc(x)}</span>`).join('')}</div></div>`;
  if(p.goodAt||p.weakTo)m2+=`<div class="two">${p.goodAt?`<div class="box"><div class="lab">Good at</div>${gl(p.goodAt)}</div>`:''}${p.weakTo?`<div class="box"><div class="lab">Struggles against</div>${gl(p.weakTo)}</div>`:''}</div>`;
  if(m2)h+=`<details><summary>Key cards, strengths and weaknesses</summary>${m2}</details>`;
  if(p.mistake)h+=`<div class="box"><div class="lab">Classic beginner mistake</div>${gl(p.mistake)}</div>`;
  const sim=(p.similar||[]).map(n=>L.find(x=>x[0]===n||key(x)===n)).filter(Boolean);
  if(sim.length)h+=`<div><div class="lab">Plays like</div><div class="row">${sim.map(x=>`<button class="link" data-open="${esc(key(x))}">${full(x)}</button>`).join('')}</div></div>`;
  if(p.deckUrl)h+=`<p><a href="${esc(p.deckUrl)}" target="_blank" rel="noopener">See a current ${esc(l[0])} decklist</a></p>`;
  return h}
function legendCard(l,m,isTop,gap){const g=styleGloss(l[6]);
  const label=m?(isTop?(gap>.12?'Clear best match':'Best match, close call'):Math.round(100*m.rel)+'% as good a fit'):'';
  return `<section class="card legend" style="${dvar(l)}"><div class="band"><div class="row" style="gap:8px">${dots(l)}<span class="small">${l[3]} + ${l[4]}</span></div>${label?`<span class="pill">${label}</span>`:''}</div>
   <div><div class="name">${esc(l[0])}</div><div class="sub">${esc(l[1])} · ${esc(l[6])}</div>${g?`<div class="small">${esc(g)}</div>`:''}</div>
   ${m?`<div class="meter" aria-hidden="true"><i style="--w:${Math.round(100*m.rel)}%"></i></div>`:''}
   <p>${gl(l[7])}</p>
   ${m&&m.why.length?`<div><h3>Why it fits you</h3><ul>${m.why.map(w=>`<li>${w}</li>`).join('')}</ul></div>`:''}
   ${facts(l)}
   <button class="${mine===key(l)?'ghost':'primary'}" data-pick="${esc(key(l))}">${mine===key(l)?'✓ This is my legend':'Choose '+esc(l[0])+' as my legend'}</button>
   ${guide(l)}</section>`}
function next3(l){const r=readyInfo(l);return `<section class="card"><h3>Your next 3 steps with ${esc(l[0])}</h3>
  <div class="step"><span class="num">1</span><div><button class="link" data-go="learn">Learn how a game works</button><div class="small">Nine short steps and an 8-question rules check.</div></div></div>
  <div class="step"><span class="num">2</span><div><button class="link" data-go="buy">Get the deck</button><div class="small">${r?esc(r[0])+', '+esc(r[2])+'.':'No ready-made deck: you buy single cards.'}</div></div></div>
  <div class="step"><span class="num">3</span><div><button class="link" data-go="play">Find a game night</button><div class="small">A checklist for your first evening at a store.</div></div></div></section>`}
function foot(){return `<p class="small">Fan-made. Tiers from riftbound.zone (1 Nov 2026). Difficulty and play-style scores are our own reading of community guides. Legend Finder was created under Riot Games' "Legal Jibber Jabber" policy using assets owned by Riot Games. Riot Games does not endorse or sponsor this project.</p>`}

function rel(r){const t=r[0].s||1;return r.map(x=>Object.assign(x,{rel:Math.max(0,Math.min(1,x.s/t))}))}
function vResult(){const r=rel(rank()),a=r[0],gap=a.s-r[3].s,p=profile(ans).p;

  <polygon points="195,62 280,62 300,85 280,108 195,108 175,85" fill="${c2}" fill-opacity=".18" stroke="${c2}" stroke-width="2"/><text x="238" y="89" text-anchor="middle">Battlefield</text>
  <rect x="100" y="136" width="120" height="30" rx="8" fill="none" stroke="var(--line-strong)" stroke-width="2"/><text x="160" y="156" text-anchor="middle">Your base</text></svg>`}
function vLearn(){if(S.lview==='rc')return vRC();return `${journey()}<div class="eyebrow">Learn</div><h2 tabindex="-1">How a game works</h2>
  <p class="lead">Take battlefields and keep them. First to 8 points wins.</p>
  <section class="card">${field()}<p class="small">Units start in your base and move out to the two battlefields. You score by conquering a battlefield and by holding it.</p></section>
  <section class="card">${STEPS.map((s,i)=>`<div class="step"><span class="num">${i+1}</span><div><b>${esc(s[0])}</b><div>${gl(s[1])}</div></div></div>`).join('')}</section>
  <h2>Ten things new players get wrong</h2><section class="card"><ol>${MIST.map(m=>`<li>${gl(m)}</li>`).join('')}</ol>
  ${J.learned?'<p class="ok">✓ Badge earned: Turn Ready</p>':'<button class="primary" data-act="learned">I\'ve read this</button>'}</section>
  <section class="card"><h3>Rules check</h3><p>Eight quick questions. Get 6 right to earn the Rules Sharp badge.${rc.best?` Your best: ${rc.best} of 8.`:''}</p><button class="${J.checked?'ghost':'primary'}" data-act="rc">${rc.best?'Try again':'Start the rules check'}</button></section>
  <h2>Keywords</h2><input type="search" id="gsearch" placeholder="Search a keyword or what it does" aria-label="Search keywords">
  <section class="card" id="gloss">${vGloss('')}</section>
  <p class="small">Rules are simplified for beginners. For exact wording, read the official rules on playriftbound.com or ask a judge.</p>
  <div class="toast" id="toast" role="status"></div>${foot()}`}
function vGloss(f){f=f.toLowerCase();const list=GLOSS.filter(g=>!f||(g[0]+' '+g[1]).toLowerCase().includes(f));return `<p class="small">${list.length} terms</p>`+list.map(g=>`<div><b>${esc(g[0])}</b><div>${esc(g[1])}</div></div>`).join('')}
function vRC(){const s=rcState;if(s.i>=RC.length){const ok=s.score>=6;return `<div class="eyebrow">Rules check</div><h2 tabindex="-1">${s.score} of ${RC.length} right</h2>
   <section class="card"><p>${ok?'<span class="ok">Badge earned: Rules Sharp.</span> You know enough to play your first game.':'Almost. Re-read the steps you missed and try again.'}</p>
   ${s.miss.length?`<div><div class="lab">Re-read</div><ul>${s.miss.map(n=>`<li>Step ${n}: ${esc(STEPS[n-1][0])}</li>`).join('')}</ul></div>`:''}
   <button class="primary" data-act="rcdone">Back to Learn</button><button class="ghost" data-act="rc">Try again</button></section>`}
  const q=RC[s.i];return `<div class="eyebrow">Rules check · ${s.i+1} of ${RC.length}</div><div class="progress" aria-hidden="true"><i style="width:${100*s.i/RC.length}%"></i></div><h2 tabindex="-1">${esc(q[0])}</h2>
  <div class="opts">${q[1].map((o,i)=>`<button class="opt" data-rc="${i}" ${s.picked!=null?'disabled':''} aria-pressed="${s.picked===i}">${esc(o)}${s.picked!=null&&i===q[2]?' ✓':''}</button>`).join('')}</div>
  ${s.picked!=null?`<section class="card"><p class="${s.picked===q[2]?'ok':'no'}">${s.picked===q[2]?'Right.':'Not quite.'}</p><p>${gl(q[3])}</p><button class="primary" data-act="rcnext">${s.i+1<RC.length?'Next question':'See my score'}</button></section>`:''}
  <button class="ghost" data-act="rcdone">Stop</button>`}

/* ---------- Buy ---------- */
const PATHS=[
 ['Try it first','Go to a store game night and ask for a demo, or borrow a deck from a friend. Most stores have people happy to teach.',['Free','Ask the store if they run Learn to Play sessions.']],
 ['One ready-made deck','A Champion Deck is a complete deck for one legend. Unleashed Champion Decks also include a booster pack, a playmat and a deck box.',['About €20 to €30','You need an opponent with their own deck.','Add sleeves (about €5 to €10).']],
 ['A starter box or two decks','The Proving Grounds box has four simple decks, enough to teach friends at home. Or buy two Champion Decks, or a two-player Showdown Deck.',['About €35 to €50','Best choice if nobody around you plays yet.']],
 ['A strong deck from single cards','Buy the exact cards for your legend from a store or a marketplace such as Cardmarket.',['€150 or more for a tournament deck; top decks cost more','Start from a current decklist (linked in your legend\'s guide).','Buy the cheap cards first and add the expensive ones later.']]];
const PRODUCTS=[['Proving Grounds box','Annie, Garen, Lux, Master Yi (4 decks)','€35 to €45'],['Champion Decks (Origins)','Jinx, Viktor, Lee Sin','€20 to €30 each'],['Champion Decks (Spiritforged)','Fiora, Rumble','€20 to €30 each'],['Champion Decks (Unleashed)','Vi, Vex','€20 to €30 each'],['Showdown Deck (Vendetta)','Zed and Shen, two players','about €35'],['Showdown Deck (Radiance)','Evelynn and Seraphine, two players','about €33'],['Booster box','24 packs of one set','about €120']];
function vBuy(){const l=focusL();const p=profile(ans).p;const b=budget!=null?budget:(ans.length>=Q.length?p.budget:1);const path=PATHS[b];let lc;
  if(l){const r=readyInfo(l);if(r)lc=`<p><b>${esc(r[0])}</b>: ${esc(r[1])}</p><p>Typical price: <b>${esc(r[2])}</b>. Ask your local game store or look it up on Cardmarket.</p>`;
   else{const n=nearestReady(l);lc=`<p>${esc(l[0])} has no ready-made deck, so you buy single cards. A beginner version costs much less than a tournament list: start from a decklist and swap expensive cards for cheaper ones.</p>${n?`<p>Cheaper start: <b>${full(n)}</b> plays in a similar way and has a ${esc(readyInfo(n)[0])} for ${esc(readyInfo(n)[2])}.</p><button class="link" data-open="${esc(key(n))}">Open the ${esc(n[0])} guide</button>`:''}${P[key(l)]&&P[key(l)].deckUrl?`<p><a href="${esc(P[key(l)].deckUrl)}" target="_blank" rel="noopener">See a current ${esc(l[0])} decklist</a></p>`:''}`}}
  return `${journey()}<div class="eyebrow">Buy</div><h2 tabindex="-1">Your first deck</h2>
  ${l?`<section class="card" style="${dvar(l)}"><div class="row">${dots(l)}<b>${full(l)}</b><span class="small">${mine?'your legend':'your quiz result'}</span></div>${lc}</section>`:`<section class="card"><p>Take the quiz first and this page tells you exactly what to get.</p><button class="primary" data-go="find">Find my legend</button></section>`}
  <div><div class="lab">Your budget</div><div class="seg">${['€0','€25','€50','€150+'].map((x,i)=>`<button data-budget="${i}" aria-pressed="${i===b}">${x}</button>`).join('')}</div></div>
  <section class="card"><h3>${esc(path[0])}</h3><p>${esc(path[1])}</p><ul>${path[2].map(x=>`<li>${esc(x)}</li>`).join('')}</ul></section>
  ${J.deck?'<p class="ok">✓ Badge earned: Deck in Hand</p>':'<button class="primary" data-act="deck">I have my deck</button>'}
  <h3>What is in the shops</h3>
  <div style="overflow-x:auto"><table><thead><tr><th>Product</th><th>Legends</th><th class="n">Price</th></tr></thead><tbody>${PRODUCTS.map(r=>`<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td><td class="n">${esc(r[2])}</td></tr>`).join('')}</tbody></table></div>
  <p class="small">Rough ranges in European shops, November 2026. Stock is often scarce, so compare a few shops.</p>
  <section class="card"><h3>Three buying tips</h3><ul><li>Booster packs are fun to open but a slow way to build a deck. Buy the deck first.</li><li>Put your cards in sleeves from day one. It keeps them playable and is expected at events.</li><li>You don't need to know League of Legends to play.</li></ul></section>
  <div class="toast" id="toast" role="status"></div>${foot()}`}

/* ---------- Play ---------- */
const CHECK=['My deck: legend, champion unit, 40 or more cards, 12 runes, 3 battlefields','Sleeves on every card','Dice or counters to track points','A Riot account, used to sign up for events','I know how a turn works (see Learn)','I will tell my opponent I am new. People are glad to help.'];
function vPlay(){const done=store.get('check',[]);return `${journey()}<div class="eyebrow">Play</div><h2 tabindex="-1">Your first game night</h2>
  <section class="card"><h3>Find a store</h3><p>The official locator lists stores and events near you.</p><p><a href="https://locator.riftbound.uvsgames.com" target="_blank" rel="noopener">Open the Riftbound store locator</a></p></section>
  <section class="card"><h3>Which event suits a beginner?</h3>
   <div><b>Nexus Night</b><div>A regular evening at local stores. The store picks the format, so ask beforehand whether it is constructed (bring your deck) or sealed (you get packs there). Promo packs are handed out while supplies last.</div></div>
   <div><b>Pre-Rift</b><div>A week before each new set: you open packs and build a deck on the spot, so nobody needs a collection.</div></div>
   <div><b>Bigger tournaments</b><div>Regional events with side events for every level. Go once you know your deck.</div></div></section>
  <section class="card"><h3>Checklist</h3>${CHECK.map((c,i)=>`<label class="check"><input type="checkbox" id="chk${i}" data-chk="${i}" ${done[i]?'checked':''}><span>${gl(c)}</span></label>`).join('')}${J.night?'<p class="ok">✓ Badge earned: Table Ready</p>':''}</section>
  <section class="card"><h3>Playing online</h3><p>There is no official digital version of Riftbound. Fan-made tools exist for practising online; ask your local community which one they use.</p></section>
  <div class="toast" id="toast" role="status"></div>${foot()}`}

/* ---------- shell ---------- */
function render(keep){let h;document.getElementById('sheet').hidden=true;
  if(S.tab==='learn')h=vLearn();else if(S.tab==='buy')h=vBuy();else if(S.tab==='play')h=vPlay();
  else h=S.view==='question'?vQuestion():S.view==='result'?vResult():S.view==='browse'?vBrowsePage():S.view==='legend'?vLegend():S.view==='friend'?vFriend():vIntro();
  app.innerHTML=h;document.querySelectorAll('nav button').forEach(b=>{if(b.dataset.tab===S.tab)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});
  if(keep==null)window.scrollTo(0,0);else if(typeof keep==='number')window.scrollTo(0,keep);
  const h2=app.querySelector('h1[tabindex],h2[tabindex]');if(h2&&keep==null)h2.focus({preventScroll:true})}
function snap(){return {tab:S.tab,view:S.view,cur:S.cur,q:S.q,y:scrollY}}
function goView(v,extra){hist.push(snap());Object.assign(S,{view:v},extra||{});S.tab='find';render()}
function back(){const s=hist.pop();if(!s){S.view='intro';return render()}Object.assign(S,{tab:s.tab,view:s.view,cur:s.cur,q:s.q});render(s.y)}
function go(t){tabY[S.tab]=scrollY;S.tab=t;if(t==='learn')S.lview='main';try{history.replaceState(null,'','#'+t)}catch(e){}render(tabY[t]||0)}
function finishQuiz(){ans=draft.slice();store.set('ans',ans);budget=null;S.editing=false;S.view='result';hist.length=0;render()}
async function share(){const r=rank(),l=r[0].l;const code='r-'+ans.join('');const url=SHARE_URL+'#'+code;
  const t=`🎴 My Riftbound legend: ${l[0]}, ${l[1]} — ${l[6].toLowerCase()}. Runners-up: ${r[1].l[0]} and ${r[2].l[0]}. Which one are you? ${url}`;
  try{if(navigator.share){await navigator.share({text:t});return}}catch(e){if(e&&e.name==='AbortError')return}
  try{await navigator.clipboard.writeText(t);toast('Copied. Paste it in the chat.')}catch(e){toast(t)}}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;
  if(d.term){showTerm(d.term);return}
  if(d.act==='closesheet'){document.getElementById('sheet').hidden=true;return}
  if(d.tab)return go(d.tab);
  if(d.go)return go(d.go);
  if(d.ans!=null){draft[S.step]=+d.ans;if(S.editing)return finishQuiz();S.step++;if(S.step>=Q.length)return finishQuiz();return render()}
  if(d.open){if(!seen.includes(d.open)){seen.push(d.open);store.set('seen',seen)}return goView('legend',{cur:d.open})}
  if(d.pick){mine=d.pick;store.set('mine',mine);setJ('found');return render(scrollY)}
  if(d.budget!=null){budget=+d.budget;return render(scrollY)}
  if(d.edit!=null){draft=ans.slice();S.step=+d.edit;S.editing=true;S.view='question';return render()}
  if(d.rc!=null){rcState.picked=+d.rc;if(+d.rc===RC[rcState.i][2])rcState.score++;else rcState.miss.push(RC[rcState.i][4]);return render(scrollY)}
  switch(d.act){
   case 'start':draft=[];S.step=0;S.editing=false;S.view='question';return render();
   case 'qback':if(S.editing||S.step===0){S.editing=false;S.view=ans.length>=Q.length?'result':'intro';return render()}S.step--;return render();
   case 'back':return back();
   case 'home':friend=null;S.view='intro';return render();
   case 'browse':return goView('browse');
   case 'result':S.view='result';return render();
   case 'share':return share();
   case 'learned':setJ('learned');return render(scrollY);
   case 'deck':setJ('deck');return render(scrollY);
   case 'rc':rcState={i:0,score:0,picked:null,miss:[]};S.lview='rc';return render();
   case 'rcnext':rcState.i++;rcState.picked=null;if(rcState.i>=RC.length){rc.best=Math.max(rc.best||0,rcState.score);store.set('rc',rc);if(rcState.score>=6)setJ('checked')}return render();
   case 'rcdone':S.lview='main';return render();
  }
});
document.addEventListener('input',e=>{const t=e.target;
  if(t.id==='search'){S.q=t.value;document.getElementById('list').innerHTML=vBrowse(t.value)}
  if(t.id==='gsearch')document.getElementById('gloss').innerHTML=vGloss(t.value);
  if(t.dataset&&t.dataset.chk!=null){const c=store.get('check',[]);c[+t.dataset.chk]=t.checked;store.set('check',c);if(CHECK.every((_,i)=>c[i])){setJ('night');render(scrollY)}}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.getElementById('sheet').hidden=true});
function fromHash(){const h=(location.hash||'').slice(1);
  if(['find','learn','buy','play'].includes(h))S.tab=h;
  const m=/^r-(\d{12})$/.exec(h);if(m){const a=m[1].split('').map(Number);if(a.every((x,i)=>x<Q[i].o.length)){friend=a;S.tab='find';S.view=ans.length>=Q.length?'result':'friend'}}}
window.addEventListener('hashchange',()=>{fromHash();render()});
if(ans.length>=Q.length)S.view='result';
fromHash();
window.__lf={rank:a=>rank(a),Q,L,P,set:a=>{draft=a.slice();finishQuiz()},go,open:k=>{S.cur=k;S.view='legend';S.tab='find';render()},nearestReady,state:()=>S};
render();
})();
</script>
</body></html>
